services:
  - type: web
    name: chalkie
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install -g pnpm@latest && pnpm install --frozen-lockfile && pnpm run build
    startCommand: node server.mjs
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: NODE_ENV
        value: production
      - key: HOSTNAME
        value: 0.0.0.0
      # Next.js embeds this public SDK license during the build, not at startup.
      - key: NEXT_PUBLIC_TLDRAW_LICENSE_KEY
        sync: false
      - key: BYOK_ENCRYPTION_SECRET
        generateValue: true
